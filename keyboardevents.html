<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>keyboard events</title>
    <style>
        #form{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            border: 2px solid black;
            border-radius: 10px;    
            background-color: rgb(40, 181, 242);
            color: white;
            width: 400px;

        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        input{
            width: 200px;
            height: 30px;
            border-radius: 5px;
            border: 1px solid black;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
        }

        </style>
        <script>
            function eventcall() {
                alert('these are keyboard events!');
            }
        </script>
</head>
<body>
    <div id="form">
        <h1>Keyboard Events</h1>
        <p>onkeydown </p>
        <input type="text" id="input1" onkeydown="alert(this.value)">
        <p>onkeyup </p>
        <input type="text" id="input2" onkeyup="alert(this.value)">
        <p>onkeypress </p>
        <input type="text" id="input3" onkeypress="alert(this.value)">
        <p>onkeyup </p>
        <input type="text" id="input4" onkeyup="document.getElementById('input4').style.backgroundColor=this.value">
        <p>onkeydown </p>
        <input type="text" id="input5" onkeydown="document.getElementById('input5').style.backgroundColor=this.value">
        <p>onkeypress </p>
        <input type="text" id="input6" onkeypress="document.getElementById('input6').style.backgroundColor=this.value">
    
         <p>onkeypress </p>
        <input type="text" id="input6" onkeypress="document.getElementById('form').style.backgroundColor=this.value">
    
    </div>
    
</body>
</html>
