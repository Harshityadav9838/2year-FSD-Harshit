<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information System</title>
</head>
<body>
    <h1>Student Information System</h1>
    <label for="studentName">Student Name:</label>
    <input type="text" id="studentName">
    <br>
    <label for="studentId">Student ID:</label>
    <input type="text" id="studentId">
    <br>
    <!-- each subject marks -->
    <label for="m1">Math:</label>
    <input type="text" id="m1">
    <br>
    <label for="m2">Science:</label>
    <input type="text" id="m2">
    <br>
    <label for="m3">English:</label>
    <input type="text" id="m3">
    <br>
    <label for="m4">History:</label>
    <input type="text" id="m4">
    <br>
    <label for="m5">Geography:</label>
    <input type="text" id="m5">
    <br>
    <label for="m6">Total Marks:</label>
    <br>
    <label for="m7">Percentage:</label>
    <br>
    <label for="studentGrade">Student Grade:</label>
    <br>
    <button onclick="displayInfo()">Display Information</button>
    <p id="info"></p>
    <script src="script.js"></script>
</body>
</html>
