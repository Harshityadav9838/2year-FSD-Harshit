<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>window event</title>
</head>
<body>
    <button onclick="openWindow()">Open Google</button>
    <button onclick="closeWindow()">Close Window</button>
    <script>
        function openWindow() {
            window.open('', '', 'width=800,height=600');
        }

        function closeWindow() {
            window.close();
        }
    </script>
    
</body>
</html>
